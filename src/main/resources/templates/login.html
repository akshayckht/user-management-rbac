<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Log in</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
    <script type="text/javascript" th:src="@{/js/app.js}"></script>
</head>
<body>
<main class="bg-gray-50 flex items-center justify-center lg:h-screen py-4 px-4 md:px-8 dark:bg-neutral-900">
    <div
            class="bg-white border border-slate-200 [box-shadow:rgba(149,157,165,0.3)_0px_4px_12px] rounded-lg p-6 max-w-lg md:max-w-2xl lg:max-w-6xl dark:bg-neutral-800 dark:border dark:border-neutral-700 dark:shadow-none">


        <div class="grid items-center gap-8 py-4 lg:grid-cols-2">
            <div class="order-1 lg:-order-1">
                <div class="aspect-[12/11] w-full">
                    <img alt="Illustration of a user logging into a secure website, with a person holding a large key beside a computer screen displaying a user login interface." class="w-full h-full object-contain"
                         src="https://readymadeui.com/signin-image.webp"/>
                </div>
            </div>

            <div class="max-w-md mx-auto w-full">
                <div class="mb-10">
                    <h1 class="text-3xl font-bold text-blue-700 dark:text-blue-500">Sign in</h1>
                </div>
                <div th:if="${param.error}"
                     class="mb-4 p-3 rounded-md bg-red-50 border border-red-200 text-red-700">
                    Invalid email or password.
                </div>
                <form th:action="@{/login}"
                      method="post"
                        class="space-y-6">
                    <div>
                        <label class="mb-2 text-slate-900 font-medium text-sm inline-block dark:text-slate-50"
                               for="email">Email</label>
                        <input type="email"
                               name="username"
                               class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:text-slate-50 dark:bg-neutral-700 dark:outline-neutral-600"
                               id="email" placeholder="john@mail.com" required
                               />
                    </div>
                    <div class="relative">
                        <label class="mb-2 text-slate-900 font-medium text-sm inline-block dark:text-slate-50"
                               for="password">Password</label>

                        <button aria-label="Show password" aria-pressed="false" class="absolute top-1 right-2 p-0.5 flex cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 rounded" id="togglePassword"
                                type="button">
                            <svg class="size-[18px] fill-slate-400 text-slate-400 overflow-visible"
                                 viewBox="0 0 128 128"
                                 xmlns="http://www.w3.org/2000/svg">
                                <path
                                        d="M64 104C22.127 104 1.367 67.496.504 65.943a4 4 0 0 1 0-3.887C1.367 60.504 22.127 24 64 24s62.633 36.504 63.496 38.057a4 4 0 0 1 0 3.887C126.633 67.496 105.873 104 64 104zM8.707 63.994C13.465 71.205 32.146 96 64 96c31.955 0 50.553-24.775 55.293-31.994C114.535 56.795 95.854 32 64 32 32.045 32 13.447 56.775 8.707 63.994zM64 88c-13.234 0-24-10.766-24-24s10.766-24 24-24 24 10.766 24 24-10.766 24-24 24zm0-40c-8.822 0-16 7.178-16 16s7.178 16 16 16 16-7.178 16-16-7.178-16-16-16z">
                                </path>
                                <path class="block" d="M10.586 10.586l106.828 106.828" id="eyeStrike"
                                      stroke="currentColor"
                                      stroke-linecap="round" stroke-width="10"></path>
                            </svg>
                        </button>

                        <input name="password"
                               class="px-3 py-2.5 text-sm text-slate-900 rounded-md bg-white w-full outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 dark:text-slate-50 dark:bg-neutral-700 dark:outline-neutral-600"
                               id="password" placeholder="••••••••" required
                               type="password"/>
                    </div>

                    <div class="flex items-start flex-wrap gap-2">
                        <label class="flex items-center group has-[input:checked]:text-slate-900">
                            <input class="sr-only" id="remember" name="remember" required type="checkbox"/>
                            <!-- Custom box -->
                            <span
                                    aria-hidden="true"
                                    class="flex h-4 w-4 shrink-0 items-center justify-center rounded outline-1 outline-slate-300 dark:outline-neutral-600 bg-white dark:bg-neutral-700 group-has-[input:checked]:bg-blue-600 group-has-[input:checked]:outline-blue-600 group-focus-within:outline-2 group-focus-within:outline-blue-600">
                <!-- Checkmark -->
                <svg class="size-3 text-white opacity-0 group-has-[input:checked]:opacity-100" fill="none"
                     stroke="currentColor" stroke-width="2" viewBox="0 0 12 10">
                  <path d="M1 5l3 3 7-7"/>
                </svg>
              </span>
                            <span class="ml-3 text-sm text-slate-700 dark:text-slate-300">
                Remember me
              </span>
                        </label>

                        <a class="ml-auto text-sm font-medium text-blue-700 dark:text-blue-500 hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 rounded"
                           href="#">
                            Forgot password?
                        </a>
                    </div>

                    <button class="w-full py-2 px-3.5 text-sm rounded-md font-semibold cursor-pointer tracking-wide text-white border border-blue-600 bg-blue-600 hover:bg-blue-700 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500"
                            type="submit">
                        Sign in
                    </button>
                </form>

                <div class="flex items-center gap-4 my-8">
                    <hr class="w-full border-slate-300 dark:border-neutral-700"/>
                    <p class="text-sm text-slate-700 text-center dark:text-slate-300">or</p>
                    <hr class="w-full border-slate-300 dark:border-neutral-700"/>
                </div>

                <div>
                    <a class="w-full flex items-center justify-center gap-2.5 py-2 px-3.5 text-sm rounded-md font-semibold text-slate-900 border border-slate-300 bg-white hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:text-slate-50 dark:border-neutral-600 dark:bg-neutral-700 dark:hover:bg-neutral-600"
                       href="#">
                        <svg aria-hidden="true" class="size-[18px]" viewBox="0 0 512 512"
                             xmlns="http://www.w3.org/2000/svg">
                            <path d="M120 256c0-25.367 6.989-49.13 19.131-69.477v-86.308H52.823C18.568 144.703 0 198.922 0 256s18.568 111.297 52.823 155.785h86.308v-86.308C126.989 305.13 120 281.367 120 256z"
                                  data-original="#fbbd00"
                                  fill="#fbbd00"/>
                            <path d="m256 392-60 60 60 60c57.079 0 111.297-18.568 155.785-52.823v-86.216h-86.216C305.044 385.147 281.181 392 256 392z"
                                  data-original="#0f9d58"
                                  fill="#0f9d58"/>
                            <path d="m139.131 325.477-86.308 86.308a260.085 260.085 0 0 0 22.158 25.235C123.333 485.371 187.62 512 256 512V392c-49.624 0-93.117-26.72-116.869-66.523z"
                                  data-original="#31aa52"
                                  fill="#31aa52"/>
                            <path d="M512 256a258.24 258.24 0 0 0-4.192-46.377l-2.251-12.299H256v120h121.452a135.385 135.385 0 0 1-51.884 55.638l86.216 86.216a260.085 260.085 0 0 0 25.235-22.158C485.371 388.667 512 324.38 512 256z"
                                  data-original="#3c79e6"
                                  fill="#3c79e6"/>
                            <path d="m352.167 159.833 10.606 10.606 84.853-84.852-10.606-10.606C388.668 26.629 324.381 0 256 0l-60 60 60 60c36.326 0 70.479 14.146 96.167 39.833z"
                                  data-original="#cf2d48"
                                  fill="#cf2d48"/>
                            <path d="M256 120V0C187.62 0 123.333 26.629 74.98 74.98a259.849 259.849 0 0 0-22.158 25.235l86.308 86.308C162.883 146.72 206.376 120 256 120z"
                                  data-original="#eb4132"
                                  fill="#eb4132"/>
                        </svg>
                        Sign in with Google
                    </a>
                </div>

                <div class="mt-6 text-slate-900 text-sm text-center dark:text-slate-50">Don't have an account? <a
                        class="text-blue-700 hover:underline ml-1 font-medium dark:text-blue-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 rounded"
                        th:href="@{/signup}">Sign
                    up</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
