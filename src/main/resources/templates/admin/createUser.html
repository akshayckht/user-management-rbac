<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crate User</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body>
<main class="h-screen">
    <div class="flex items-start h-full">
        <!-- sidebar -->
        <aside class="w-[264px] min-w-[264px] overflow-hidden opacity-100 transition-all duration-300 ease-in-out"
               id="sidebar" aria-label="Sidebar navigation">
            <div id="sidebar-inner"
                 class="fixed top-0 left-0 w-[264px] h-full flex flex-col overflow-auto py-6 px-4 bg-white dark:bg-neutral-900 border-r border-slate-300 dark:border-neutral-700">
                <!--side nav bar-->
                <nav class="flex-1" aria-label="Primary sidebar navigation">
                    <div>
                        <button type="button" aria-controls="sub-menu-0" aria-expanded="false"
                                class="flex items-center gap-2.5 cursor-pointer w-full text-sm text-slate-800 dark:text-slate-400 font-medium text-left group collapsible-toggle hover:text-slate-900 dark:hover:text-slate-50 hover:bg-slate-100 dark:hover:bg-neutral-800 rounded-md px-3 py-2 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                            <svg xmlns="http://www.w3.org/2000/svg" class="size-[18px] fill-current overflow-visible"
                                 viewBox="0 0 512 512" aria-hidden="true">
                                <path
                                        d="M426 495.983H86c-25.364 0-46-20.635-46-46v-242.02c0-8.836 7.163-16 16-16s16 7.164 16 16v242.02c0 7.72 6.28 14 14 14h340c7.72 0 14-6.28 14-14v-242.02c0-8.836 7.163-16 16-16s16 7.164 16 16v242.02c0 25.364-20.635 46-46 46"
                                        data-original="#000000"/>
                                <path
                                        d="M496 263.958a15.95 15.95 0 0 1-11.313-4.687L285.698 60.284c-16.375-16.376-43.02-16.376-59.396 0L27.314 259.272c-6.248 6.249-16.379 6.249-22.627 0-6.249-6.248-6.249-16.379 0-22.627L203.675 37.656c28.852-28.852 75.799-28.852 104.65 0l198.988 198.988c6.249 6.249 6.249 16.379 0 22.627A15.94 15.94 0 0 1 496 263.958M320 495.983H192c-8.837 0-16-7.164-16-16v-142c0-27.57 22.43-50 50-50h60c27.57 0 50 22.43 50 50v142c0 8.836-7.163 16-16 16m-112-32h96v-126c0-9.925-8.075-18-18-18h-60c-9.925 0-18 8.075-18 18z"
                                        data-original="#000000"/>
                            </svg>

                            <span class="flex-1">Admin Dashboard</span>

                            <svg xmlns="http://www.w3.org/2000/svg" class="arrow size-3 fill-current transition-all"
                                 viewBox="0 0 24 24" aria-hidden="true">
                                <path
                                        d="M12.016 18a1.5 1.5 0 0 1-1.065-.434l-9-9a1.506 1.506 0 0 1 2.13-2.13l7.935 7.95L19.95 6.45a1.5 1.5 0 0 1 2.115 2.115l-9 9a1.5 1.5 0 0 1-1.05.435"
                                        data-name="16" data-original="#000000"/>
                            </svg>
                        </button>
                    </div>
                </nav>

                <form th:action="@{/logout}"
                      method="post">
                    <button type="submit"
                            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-full ml-10">
                        Logout
                    </button>
                </form>
            </div>
        </aside>
        <div class="w-full h-full">
            <!-- header -->
            <header
                    class="flex py-2 sticky top-0 w-full bg-white border-b border-slate-300 px-6 dark:border-neutral-700 dark:bg-neutral-900 min-h-[68px] z-20"
                    aria-label="header">
                <div class="flex flex-wrap items-center gap-4 w-full">
                    <!-- Sidebar Toggle btn -->
                    <button type="button" aria-controls="collapseSidebar" aria-expanded="true" aria-haspopup="true"
                            id="toggleSidebar"
                            class="cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 rounded">
                        <span class="sr-only">Toggle sidebar menu</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="size-[18px] fill-slate-900 dark:fill-slate-50"
                             viewBox="0 0 20 20" aria-hidden="true">
                            <path fill-rule="evenodd"
                                  d="M.13 17.05a1.41 1.41 0 0 1 1.41-1.41H10a1.41 1.41 0 1 1 0 2.82H1.54a1.41 1.41 0 0 1-1.41-1.41zm0-14.1a1.41 1.41 0 0 1 1.41-1.41h16.92a1.41 1.41 0 1 1 0 2.82H1.54A1.41 1.41 0 0 1 .13 2.95zm0 7.05a1.41 1.41 0 0 1 1.41-1.41h16.92a1.41 1.41 0 1 1 0 2.82H1.54A1.41 1.41 0 0 1 .13 10z"
                                  clip-rule="evenodd" data-original="#000000"/>
                        </svg>
                    </button>

                    <h1 class="text-xl text-slate-900 font-bold dark:text-slate-50">Admin Dashboard</h1>

                    <div class="flex items-center flex-wrap gap-4 ml-auto">
                        <div class="relative max-w-xs place-content-center" id="searchWrapper">
                            <!-- Search Box -->
                            <form role="search" id="searchBox"
                                  class="flex items-center gap-2.5 px-3 py-2.5 rounded-md bg-white max-lg:hidden dark:bg-neutral-800 outline-1 -outline-offset-1 outline-slate-300 dark:outline-neutral-700 focus-within:outline-2 focus-within:-outline-offset-2 focus-within:outline-blue-600">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192.904 192.904"
                                     class="size-4 fill-slate-400" aria-hidden="true">
                                    <path
                                            d="m190.707 180.101-47.078-47.077c11.702-14.072 18.752-32.142 18.752-51.831C162.381 36.423 125.959 0 81.191 0 36.422 0 0 36.423 0 81.193c0 44.767 36.422 81.187 81.191 81.187 19.688 0 37.759-7.049 51.831-18.751l47.079 47.078a7.474 7.474 0 0 0 5.303 2.197 7.498 7.498 0 0 0 5.303-12.803zM15 81.193C15 44.694 44.693 15 81.191 15c36.497 0 66.189 29.694 66.189 66.193 0 36.496-29.692 66.187-66.189 66.187C44.693 147.38 15 117.689 15 81.193z">
                                    </path>
                                </svg>
                                <input type="search" id="search" placeholder="Search..."
                                       class="text-sm text-slate-900 dark:text-slate-50 w-full outline-none bg-transparent"/>
                            </form>

                            <!-- Mobile search icon -->
                            <button id="searchToggle"
                                    class="lg:hidden rounded-md focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 right-2">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192.904 192.904"
                                     class="size-4.5 fill-slate-600 dark:fill-slate-400" aria-hidden="true">
                                    <path
                                            d="m190.707 180.101-47.078-47.077c11.702-14.072 18.752-32.142 18.752-51.831C162.381 36.423 125.959 0 81.191 0 36.422 0 0 36.423 0 81.193c0 44.767 36.422 81.187 81.191 81.187 19.688 0 37.759-7.049 51.831-18.751l47.079 47.078a7.474 7.474 0 0 0 5.303 2.197 7.498 7.498 0 0 0 5.303-12.803zM15 81.193C15 44.694 44.693 15 81.191 15c36.497 0 66.189 29.694 66.189 66.193 0 36.496-29.692 66.187-66.189 66.187C44.693 147.38 15 117.689 15 81.193z">
                                    </path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <!-- middle contents -->
            <section class="p-6">
                <form th:action="@{/admin/createuser/user}"
                      th:object="${adminUserCreateRequest}"
                      method="post"
                        class="px-4 mt-6">
                    <div class="space-y-6 max-w-md mx-auto">
                        <div>
                            <label for="name"
                                   class="text-slate-900 font-medium text-[14px] inline-block mb-1">Name</label>
                            <input th:field="*{name}" type="text" id="name" name="name" placeholder="John Smith" required
                                   class="px-1 py-2.5 text-sm text-slate-900 bg-white w-full border-b-2 border-slate-300 focus:border-blue-600 outline-none"/>
                        </div>
                        <div>
                            <label for="email"
                                   class="text-slate-900 font-medium text-[13px] inline-block mb-1">Email</label>
                            <input th:field="*{email}"

                                    type="email" id="email" name="email" placeholder="john@readymadeui.com" required
                                   class="px-1 py-2.5 text-sm text-slate-900 bg-white w-full border-b-2 border-slate-300 focus:border-blue-600 outline-none"/>
                        </div>
                        <div>
                            <label for="password"
                                   class="text-slate-900 font-medium text-[14px] inline-block mb-1">Password</label>
                            <input
                                    th:field="*{password}"
                                    type="password" id="password" name="password" placeholder="**********" required
                                   class="px-1 py-2.5 text-sm text-slate-900 bg-white w-full border-b-2 border-slate-300 focus:border-blue-600 outline-none"/>
                        </div>

                        <div>
                            <label for="roel"
                                   class="text-slate-900 font-medium text-[14px] inline-block mb-1">Role</label>
                            <select
                                    th:field="*{role}"
                                    id="roel" name="role"
                                    class="px-1 py-2.5 text-sm text-slate-900 bg-white w-full border-b-2 border-slate-300 focus:border-blue-600 outline-none">
                                <option value="USER">USER</option>
                                <option value="ADMIN">ADMIN</option>
                            </select>
                        </div>

                        <button type="submit"
                                class="!mt-2 py-2 px-3.5 text-sm rounded-md font-semibold cursor-pointer tracking-wide text-white border border-blue-600 bg-blue-600 hover:bg-blue-700 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                            Submit
                        </button>
                    </div>
                </form>
            </section>
        </div>

    </div>
</main>
</body>
</html>
