
spring:
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/springapp_db}"
    username: "${DB_USER_NAME:spring}"
    password: "${DB_PASSWORD:spring123}"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: info
